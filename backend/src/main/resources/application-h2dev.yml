spring:
  datasource:
    url: "jdbc:h2:mem:ad_causalrisk_dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  model-repository:
    dir: target/dev-model-repository

research:
  task:
    recovery-enabled: false
    lease-seconds: 900