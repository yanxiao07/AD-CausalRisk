# Test profile: H2 in MySQL compatibility mode.
#
# No Docker and no Testcontainers (recorded decision for this PR). db/migration/V1
# therefore has to stay inside the MySQL-8 / H2-MySQL intersection, which V1
# documents at the top of the file.
#
# DATABASE_TO_LOWER + CASE_INSENSITIVE_IDENTIFIERS make H2 store unquoted
# identifiers the way MySQL does, which keeps 'ddl-auto: validate' meaningful.
# DB_CLOSE_DELAY=-1 keeps the in-memory schema alive for the whole JVM so every
# test class shares one migrated database; tests isolate themselves with
# @Transactional rollback rather than by dropping the schema.
spring:
  datasource:
    url: "jdbc:h2:mem:ad_causalrisk_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

assessment:
  test-rule-enabled: true

research:
  table:
    test-fixtures-enabled: true
