name: Python research primitive checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  standard-library:
    name: Standard library (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check exact abstract causal identification example
        run: python -I -S -B examples/causal_identification_audit.py
      - name: Check exact functional and decision bounds without site packages
        run: >-
          python -B -S -m unittest
          research_runtime.tests.test_competing_event_functional
          research_runtime.tests.test_decision_curve
          research_runtime.tests.test_experiment_config
          research_runtime.tests.test_graph_experiment_config -v

  numpy:
    name: NumPy (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Constraints reuse the existing NumPy pin without installing the full
      # training environment (pandas, scikit-learn, XGBoost, or Torch).
      - name: Install only the existing locked NumPy wheel
        run: >-
          python -m pip install --only-binary=:all:
          --constraint research_runtime/requirements.lock numpy
      - name: Check constructed monitoring, structure and explanation binding
        run: >-
          python -B -m unittest
          research_runtime.tests.test_feature_drift
          research_runtime.tests.test_performance_monitor
          research_runtime.tests.test_lifecycle_monitor
          research_runtime.tests.test_graph_structure_stability
          research_runtime.tests.test_prediction_explanation_candidate -v
